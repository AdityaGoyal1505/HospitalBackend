spring.application.name=${SPRING_APPLICATION_NAME:Hospital}

# Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}

# Active Profiles (use 'prod' for production, 'local' for local dev)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hospital_db}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:password}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# HikariCP Connection Pool (Production Tuning)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:5}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT:20000}
spring.datasource.hikari.max-lifetime=${DB_POOL_MAX_LIFETIME:1200000}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}

# Twilio SMS Configuration (Optional)
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}

# Meta WhatsApp Cloud API Configuration
whatsapp.api.base-url=${WHATSAPP_API_BASE_URL:https://graph.facebook.com}
whatsapp.api.version=${WHATSAPP_API_VERSION:v26.0}
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.api.access-token=${WHATSAPP_ACCESS_TOKEN:}
whatsapp.api.otp-template-name=${WHATSAPP_OTP_TEMPLATE_NAME:hospital_otp_verification}
whatsapp.api.template-language=${WHATSAPP_API_TEMPLATE_LANGUAGE:en_US}

# Authentication & Security Secrets
hospital.auth.otp-hmac-secret=${HOSPITAL_OTP_HMAC_SECRET:VG0zeB85YjvK5HIzxEyP4EJUstw4xDL7nXEraOyt5Rk}
hospital.auth.jwt-secret-base64=${HOSPITAL_JWT_SECRET_BASE64:U1w5WWcqpuUfLaAWysJsO+22LFywOwcY7KSXWcvhwP4=}
hospital.auth.jwt-expiration-seconds=${HOSPITAL_JWT_EXPIRATION_SECONDS:3600}
hospital.auth.jwt-issuer=${HOSPITAL_JWT_ISSUER:hospital-api}

# Hospital Business Logic
hospital.stock.low-threshold=${HOSPITAL_STOCK_LOW_THRESHOLD:5}

# Document & Storage Configuration
app.storage.local-dir=${DOCUMENT_STORAGE_DIR:./private-storage/documents}
app.documents.max-size-bytes=${APP_DOCUMENTS_MAX_SIZE_BYTES:5242880}
spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:6MB}

# Push Notifications
app.push.enabled=${APP_PUSH_ENABLED:false}

# Logging Configuration (Default INFO for production stability; configurable per environment)
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.com.example.Hospital=${LOGGING_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOGGING_LEVEL_SECURITY:INFO}
logging.level.org.springframework.security.oauth2=${LOGGING_LEVEL_OAUTH2:INFO}
logging.level.org.springframework.web=${LOGGING_LEVEL_WEB:INFO}
